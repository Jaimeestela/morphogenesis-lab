[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morphogenesis-lab"
version = "0.1.0"
description = "Reaction-diffusion (Turing) patterns and CAD path generation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.57",
    "matplotlib>=3.7",
    "shapely>=2.0",
    "scikit-image>=0.20",
    "networkx>=3.0",
    "ezdxf>=1.0",
    "svgwrite>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.1",
    "black>=23",
    "mypy>=1.0",
]
viz = ["trimesh", "pyvista"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["morphogenesis*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["morphogenesis"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
